apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.morphos.videotranscode"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
    targetSdk safeExtGet("targetSdkVersion", 34)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.media3:media3-transformer:1.4.1"
  implementation "androidx.media3:media3-effect:1.4.1"
  implementation "androidx.media3:media3-common:1.4.1"
  implementation "androidx.media3:media3-muxer:1.4.1"
}
